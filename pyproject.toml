[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-queue"
version = "0.1.0"
description = "FIFO queue for declarative YAML pipelines"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
pq = "pq.cli:main"

[tool.setuptools.packages.find]
include = ["pq*"]
